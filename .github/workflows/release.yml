# Publishes a GitHub release for a vX.Y.Z tag, in two steps; the first failure stops it.
#
# - gate: the tag names the version in pyproject.toml, __init__.py, and CITATION.cff, CHANGELOG.md has its section,
#   the tagged commit is main's head, and main's CI on that commit has passed. Nothing is rebuilt: a tag pushed
#   before that CI run finishes fails, and the release is re-run once it has passed. CI keeps the packages for
#   90 days; after that, the release needs a new CI run on main.
# - publish: the wheel and sdist that CI built and smoke-tested, with checksums and the changelog section as notes,
#   as a draft release first, so a failed upload or attestation can be re-run without a half-published release;
#   attestations; and only then the public release.
#
# Started by hand on main, it rehearses the gate for main's version and publishes nothing.
# It does not upload to a package index.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      run: ${{ steps.ci.outputs.run }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag, version, and notes
        id: tag
        run: |
          set -euo pipefail
          version=$(bash .github/scripts/release.sh version)
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            test "$GITHUB_REF" = refs/heads/main || { echo "a rehearsal runs on main, not $GITHUB_REF" >&2; exit 1; }
            tag="v$version"
          else
            tag="$GITHUB_REF_NAME"
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must be vX.Y.Z: $tag" >&2; exit 1; }
            test "$tag" = "v$version" || { echo "tag $tag does not match version $version" >&2; exit 1; }
          fi
          bash .github/scripts/release.sh notes "$tag" > /dev/null
          printf 'tag=%s\nversion=%s\n' "$tag" "$version" >> "$GITHUB_OUTPUT"

      - name: Check the commit is main's head
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          main=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          test "$GITHUB_SHA" = "$main" || { echo "$TAG at $GITHUB_SHA is not main's head ($main)" >&2; exit 1; }

      - name: Find main's passed CI run on the commit
        id: ci
        run: |
          set -euo pipefail
          run=$(gh run list --workflow ci.yml --branch main --commit "$GITHUB_SHA" --limit 20 \
            --json databaseId,event,status,conclusion \
            --jq '[.[] | select(.event == "push")][0] // empty | [.databaseId, .status, .conclusion] | @tsv')
          [[ -n "$run" ]] || { echo "no CI run on main for $GITHUB_SHA" >&2; exit 1; }
          IFS=$'\t' read -r id status conclusion <<< "$run"
          [[ "$status" == completed ]] || { echo "CI run $id on main has not finished; re-run the release after it passes" >&2; exit 1; }
          [[ "$conclusion" == success ]] || { echo "CI run $id on main concluded $conclusion" >&2; exit 1; }
          printf 'run=%s\n' "$id" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish release
    needs: gate
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      TAG: ${{ needs.gate.outputs.tag }}
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag still names the verified commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tagged=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
          test "$tagged" = "$GITHUB_SHA" || { echo "tag $TAG moved to $tagged during the release" >&2; exit 1; }

      - name: Download the tested packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ needs.gate.outputs.run }}
          github-token: ${{ github.token }}
          name: release-dist
          path: ${{ runner.temp }}/assets

      - name: Prepare notes and checksums
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/assets"
          for name in "harmonizepy-$VERSION-py3-none-any.whl" "harmonizepy-$VERSION.tar.gz"; do
            test -s "$name" || { echo "missing tested package: $name" >&2; exit 1; }
          done
          count=$(find . -maxdepth 1 -type f | wc -l)
          test "$count" -eq 2 || { echo "expected the 2 tested packages, found $count files: $(ls)" >&2; exit 1; }
          sha256sum ./*.whl ./*.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS
          cd "$GITHUB_WORKSPACE"
          bash .github/scripts/release.sh notes "$TAG" > "$RUNNER_TEMP/notes.md"

      - name: Create or resume the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2> "$RUNNER_TEMP/view.err"); then
            test "$draft" = true || { echo "release $TAG is already published" >&2; exit 1; }
          elif grep -q "release not found" "$RUNNER_TEMP/view.err"; then
            gh release create "$TAG" --draft --verify-tag --title "HarmonizePy $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          else
            cat "$RUNNER_TEMP/view.err" >&2
            exit 1
          fi
          gh release upload "$TAG" "$RUNNER_TEMP/assets"/* --clobber

      - name: Attest the release packages
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/assets/SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --draft=false --latest --verify-tag
